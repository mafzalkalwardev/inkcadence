name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web
      - name: Test
        run: npm test
      - name: Build the browser app
        run: npm run build --prefix web
      - name: Assemble the Pages site
        run: |
          mkdir -p _site/app _site/classic/js _site/classic/assets
          cp -a docs/. _site/
          cp -a web/dist/. _site/app/
          cp index.html sheet.html _site/classic/
          cp -a js/. _site/classic/js/
          if [ -d assets ]; then cp -a assets/. _site/classic/assets/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
