name: Deploy official site

# Publishes the same tree as Pages to the Oracle VPS behind
# https://inkcadence.induswebagency.com/ when OFFICIAL_SSH_KEY is set.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-official
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OFFICIAL_SSH_KEY: ${{ secrets.OFFICIAL_SSH_KEY }}
      OFFICIAL_SSH_HOST: ${{ secrets.OFFICIAL_SSH_HOST }}
      OFFICIAL_SSH_USER: ${{ secrets.OFFICIAL_SSH_USER }}
      OFFICIAL_SSH_PATH: ${{ secrets.OFFICIAL_SSH_PATH }}
    steps:
      - name: Require deploy key
        if: ${{ env.OFFICIAL_SSH_KEY == '' }}
        run: |
          echo "::notice::Skipping official deploy — add repo secret OFFICIAL_SSH_KEY (and optional OFFICIAL_SSH_HOST / USER / PATH)."
          exit 0

      - uses: actions/checkout@v4
        if: ${{ env.OFFICIAL_SSH_KEY != '' }}

      - uses: actions/setup-node@v4
        if: ${{ env.OFFICIAL_SSH_KEY != '' }}
        with:
          node-version: "20"
          cache: npm

      - name: Assemble site
        if: ${{ env.OFFICIAL_SSH_KEY != '' }}
        run: bash scripts/assemble-site.sh

      - name: Publish to inkcadence.induswebagency.com
        if: ${{ env.OFFICIAL_SSH_KEY != '' }}
        run: |
          set -euo pipefail
          host="${OFFICIAL_SSH_HOST:-89.168.127.135}"
          user="${OFFICIAL_SSH_USER:-ubuntu}"
          # nginx root for inkcadence.induswebagency.com (see sites-available/inkcadence)
          dest="${OFFICIAL_SSH_PATH:-/opt/inkcadence/www}"
          mkdir -p ~/.ssh
          printf '%s\n' "$OFFICIAL_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
          # www is root-owned; remote sudo rsync matches how the VPS hosts other static sites
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            --rsync-path="sudo rsync" \
            _site/ "${user}@${host}:${dest}/"
          echo "Published to ${user}@${host}:${dest}"
