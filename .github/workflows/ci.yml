name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Install web deps
        run: npm ci --prefix web
      - name: Lint (syntax)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build web
        run: npm run build --prefix web
