<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/inkcadence-mark.svg">
  <title>Inkcadence — write in your own hand</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('inkcadence-theme');
        var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#14110e' : '#f4efe6');
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Write the words you supply in your own handwriting. The app runs in the browser, on your device.">
  <meta name="theme-color" content="#f4efe6">
  <link rel="canonical" href="https://mafzalkalwardev.github.io/inkcadence/">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
