<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/inkcadence-mark.svg">
  <title>Inkcadence — write in your own hand</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('inkcadence-theme');
        var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#14110e' : '#f4efe6');
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Write the words you supply in your own handwriting. The app runs in the browser, on your device.">
  <meta name="theme-color" content="#f4efe6">
  <link rel="canonical" href="https://inkcadence.induswebagency.com/">
  <meta property="og:url" content="https://inkcadence.induswebagency.com/">
  <style>
    .official-site {
      margin: 0; padding: 8px 16px; text-align: center;
      font: 14px/1.4 system-ui, "Segoe UI", sans-serif;
      background: #f4efe6; color: #5c4d42; border-bottom: 1px solid #e4d8c8;
    }
    .official-site a { color: #8d3f2c; font-weight: 700; }
    html[data-theme="dark"] .official-site {
      background: #1c1814; color: #e7d9cc; border-bottom-color: #3a3028;
    }
    html[data-theme="dark"] .official-site a { color: #e7b089; }
  </style>
</head>
<body>
  <p class="official-site">Official site: <a href="https://inkcadence.induswebagency.com/">inkcadence.induswebagency.com</a></p>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
